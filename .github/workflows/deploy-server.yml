name: Build + deploy full catalog to server

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * *'   # daily 03:00 UTC

permissions:
  contents: read

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Install deps
        run: cd productsite && npm i --no-save csv-parse@^6.1.0 slugify@^1.6.6

      - name: Fetch + concat all feeds
        run: node scripts/fetch-all.mjs
        env: { MEGAFEEDS: /tmp/megafeeds }

      - name: Generate full tree
        run: |
          cd productsite
          MANIFEST=/tmp/megafeeds/manifest.tsv \
          LOGOS=$GITHUB_WORKSPACE/data/logos.json STORESAFF=$GITHUB_WORKSPACE/data/stores-aff.json \
          PROMOS=$GITHUB_WORKSPACE/data/promos.json PROTECTED=$GITHUB_WORKSPACE/data/protected.json \
          OUT_DIR=/tmp/www/dist node --max-old-space-size=14000 generate.mjs
          rm -rf /tmp/megafeeds
          echo "files: $(find /tmp/www/dist -type f | wc -l) | size: $(du -sh /tmp/www/dist | cut -f1)"

      - name: Deploy to server (stream tar over SSH, atomic swap)
        run: |
          mkdir -p ~/.ssh && echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          H="${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          SSH="ssh -i ~/.ssh/deploy -o StrictHostKeyChecking=no"
          tar czf - -C /tmp/www/dist . | $SSH $H '
            set -e
            sudo rm -rf /var/www/topbuy_new && sudo mkdir -p /var/www/topbuy_new
            sudo tar xzf - -C /var/www/topbuy_new
            sudo rm -rf /var/www/topbuy_old
            sudo mv /var/www/topbuy /var/www/topbuy_old 2>/dev/null || true
            sudo mv /var/www/topbuy_new /var/www/topbuy
            sudo chown -R www-data:www-data /var/www/topbuy
            sudo systemctl restart tbsvc
            echo "deployed: $(find /var/www/topbuy -type f | wc -l) files"
          '
